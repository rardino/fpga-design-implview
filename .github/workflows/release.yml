name: release

# A v* tag (matching __version__) publishes to PyPI and makes a GitHub release.
# Running the workflow by hand (Actions > release > Run workflow) publishes to
# TestPyPI instead. Both use trusted publishing: no token is stored.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  tests:
    uses: ./.github/workflows/tests.yml

  build:
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
      - run: pip install build twine
      - run: python -m build
      - run: twine check --strict dist/*
      - name: Tag matches the version
        if: github.ref_type == 'tag'
        run: |
          v=$(PYTHONPATH=src python -c "import fpga_design_implview as m; print(m.__version__)")
          test "v$v" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME, version $v"; exit 1; }
      - name: Tests on the wheel, from the sdist
        run: |
          mkdir sdist && tar xzf dist/*.tar.gz -C sdist --strip-components=1
          pip install dist/*.whl pytest
          cd sdist && python -m pytest -q -p no:cacheprovider
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/fpga-design-implview
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/fpga-design-implview
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  github-release:
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
